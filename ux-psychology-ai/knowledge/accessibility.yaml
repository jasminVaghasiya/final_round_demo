# ACCESSIBILITY KNOWLEDGE — Compact AI Runtime
# Full reference: /layers/07-accessibility/
# Source authority: WCAG 2.1 (W3C 2018) and WCAG 2.2 (W3C 2023)

conformance_target: AA  # minimum for most web content

# ── PERCEIVABLE ────────────────────────────────────────────────────────────────
perceivable:
  "1.1.1":
    level: A
    rule: all_non_text_content_has_text_alternative
    apply:
      - informative_images: descriptive_alt
      - decorative_images: "alt=''"
      - complex_charts: data_table_or_description
      - icon_buttons: aria_label_with_purpose
      - form_inputs: associated_label_or_aria_label

  "1.3.1":
    level: A
    rule: structure_and_relationships_are_programmatically_determined
    apply:
      - use: [h1-h6, nav, main, section, article, aside, footer]
      - forms: "label[for=id] or aria-labelledby"
      - required: "aria-required or required + text indicator"
      - groups: "fieldset + legend for radio/checkbox groups"
      - tables: "th[scope] + caption"

  "1.3.4":
    level: AA
    rule: no_orientation_lock

  "1.3.5":
    level: AA
    rule: autocomplete_attributes_on_personal_data_fields

  "1.4.1":
    level: A
    rule: color_not_sole_conveyance_of_information
    apply:
      - errors: color + icon + text
      - required: asterisk + text indicator
      - links_in_body: underline
      - charts: pattern + label + color

  "1.4.3":
    level: AA
    contrast:
      body_text:  "4.5:1"
      large_text: "3:1"  # ≥18pt or ≥14pt bold

  "1.4.4":
    level: AA
    rule: text_resizes_200_percent_without_loss

  "1.4.10":
    level: AA
    rule: reflow_at_400_percent_no_horizontal_scroll

  "1.4.11":
    level: AA
    rule: ui_components_3_to_1_contrast_against_adjacent_color
    apply: [input_borders, button_borders, focus_rings, chart_elements, icons]

  "1.4.12":
    level: AA
    rule: text_spacing_overridable_without_loss
    thresholds:
      line_height: "≥1.5× font-size"
      letter_spacing: "≥0.12× font-size"
      word_spacing: "≥0.16× font-size"

# ── OPERABLE ─────────────────────────────────────────────────────────────────
operable:
  "2.1.1":
    level: A
    rule: all_functionality_keyboard_accessible

  "2.1.2":
    level: A
    rule: no_keyboard_trap_except_intentional_modal_with_escape

  "2.4.1":
    level: A
    rule: skip_to_main_content_as_first_focusable_element

  "2.4.3":
    level: A
    rule: focus_order_matches_reading_order
    apply:
      - modal_open: focus_moves_to_dialog
      - modal_close: focus_returns_to_trigger
      - dynamic_content: manage_focus_to_relevant_new_content

  "2.4.7":
    level: AA
    rule: keyboard_focus_always_visible

  "2.4.11":
    level: AA
    wcag_version: "2.2"
    rule: focus_area_min_perimeter_times_2px_contrast_3_to_1

  "2.5.1":
    level: A
    rule: pointer_gestures_have_button_alternatives

  "2.5.3":
    level: A
    rule: accessible_name_contains_visible_label_text

  "2.5.8":
    level: AA
    wcag_version: "2.2"
    rule: touch_targets_min_24x24px
    recommended: "44x44px"

# ── UNDERSTANDABLE ────────────────────────────────────────────────────────────
understandable:
  "3.1.1":
    level: A
    rule: "html[lang] attribute set"

  "3.2.1":
    level: A
    rule: focus_does_not_trigger_context_change

  "3.2.2":
    level: A
    rule: input_change_does_not_trigger_unexpected_navigation

  "3.2.3":
    level: AA
    rule: navigation_consistent_across_pages

  "3.3.1":
    level: A
    rule: errors_identified_in_text_with_specific_description

  "3.3.2":
    level: A
    rule: labels_and_instructions_provided_before_input

  "3.3.3":
    level: AA
    rule: error_correction_suggestions_provided_when_known

  "3.3.4":
    level: AA
    rule: legal_financial_submissions_are_reversible_checked_or_confirmed

  "3.3.7":
    level: A
    wcag_version: "2.2"
    rule: previously_entered_info_auto_populated_in_same_session

# ── ROBUST ────────────────────────────────────────────────────────────────────
robust:
  "4.1.2":
    level: A
    rule: all_ui_components_have_name_role_value
    apply:
      - prefer: native_html_over_aria
      - custom_components: role + aria_states + aria_label
      - states: [aria-expanded, aria-selected, aria-checked, aria-pressed, aria-disabled, aria-invalid]

  "4.1.3":
    level: AA
    rule: status_messages_available_without_focus_move
    implementation:
      errors:   "role='alert' or aria-live='assertive'"
      success:  "role='status' or aria-live='polite'"
      loading:  "aria-busy='true' on target element"

# ── ARIA QUICK REFERENCE ──────────────────────────────────────────────────────
aria_patterns:
  accordion:   {trigger: button, panel: region, state: aria-expanded}
  tabs:        {container: tablist, item: tab, content: tabpanel, state: aria-selected}
  modal:       {container: dialog, required: [aria-modal, aria-labelledby], key: Escape_closes}
  combobox:    {role: combobox, state: [aria-expanded, aria-activedescendant]}
  toggle:      {role: button, state: aria-pressed}
  alert:       {role: alert, auto_announces: true}
  status:      {role: status, polite: true}
  progress:    {role: progressbar, state: [aria-valuenow, aria-valuemin, aria-valuemax]}
